version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # Application IA & Serveur FastAPI
  # ----------------------------------------------------------------------------
  vision-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vision-ia-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - REQUIRE_AUTH=true
    volumes:
      # Persistance des visages mémorisés, captures et base d'audit
      - ./data:/app/data
      - ./certs:/app/certs
      # Possibilité de monter des modèles personnalisés
      - ./config.yaml:/app/config.yaml
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - vision-network

  # ----------------------------------------------------------------------------
  # Reverse Proxy Nginx & Terminaison SSL
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: vision-ia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./static:/app/static:ro
    depends_on:
      vision-app:
        condition: service_healthy
    networks:
      - vision-network

networks:
  vision-network:
    driver: bridge
